name: Keep Backend Awake

on:
  schedule:
    # Runs every 12 minutes
    - cron: '*/12 * * * *'
  workflow_dispatch: # Allows manual triggering from GitHub UI

jobs:
  ping-services:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Normal Backend Health Check
        run: |
          if [ -n "${{ secrets.BACKEND_URL }}" ]; then
            echo "Pinging normal backend..."
            curl -f -S -s -I "${{ secrets.BACKEND_URL }}/api/health"
          else
            echo "::warning::The BACKEND_URL secret is not configured in your repository settings."
          fi

      - name: Ping AI Service Health Check
        run: |
          if [ -n "${{ secrets.AI_URL }}" ]; then
            echo "Pinging AI service..."
            # Pings /docs (built-in FastAPI OpenAPI route) or falls back to root `/`
            curl -f -S -s -I "${{ secrets.AI_URL }}/docs" || curl -S -s -I "${{ secrets.AI_URL }}/"
          else
            echo "::warning::The AI_URL secret is not configured in your repository settings."
          fi
