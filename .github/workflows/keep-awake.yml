name: Keep Backend Awake

on:
  schedule:
    # Runs every 12 minutes
    - cron: '*/12 * * * *'
  workflow_dispatch: # Allows manual triggering from GitHub UI

jobs:
  ping-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Backend Health Check
        run: |
          if [ -z "${{ secrets.BACKEND_URL }}" ]; then
            echo "::error::The BACKEND_URL secret is not configured in your repository settings."
            exit 1
          fi
          echo "Pinging backend at ${{ secrets.BACKEND_URL }}/api/health..."
          curl -f -S -s -I "${{ secrets.BACKEND_URL }}/api/health"
