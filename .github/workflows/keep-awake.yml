name: Keep Backend Awake

on:
  schedule:
    # Runs every 12 minutes to prevent Render free tier sleep (15-min threshold)
    - cron: '*/12 * * * *'
  workflow_dispatch: # Allows manual triggering from GitHub UI

jobs:
  ping-services:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Normal Backend Health Check
        run: |
          if [ -z "${{ secrets.BACKEND_URL }}" ]; then
            echo "::error::BACKEND_URL secret is not set! Go to Settings → Secrets → Actions to add it."
            exit 1
          fi
          echo "Pinging normal backend at ${{ secrets.BACKEND_URL }}/api/health ..."
          curl --fail --silent --show-error --max-time 30 "${{ secrets.BACKEND_URL }}/api/health"
          echo ""
          echo "✅ Normal backend is awake!"

      - name: Ping AI Service Health Check
        run: |
          if [ -z "${{ secrets.AI_URL }}" ]; then
            echo "::error::AI_URL secret is not set! Go to Settings → Secrets → Actions to add it."
            exit 1
          fi
          echo "Pinging AI service at ${{ secrets.AI_URL }}/health ..."
          # Tries /health first (new endpoint), falls back to root /
          curl --fail --silent --show-error --max-time 30 "${{ secrets.AI_URL }}/health" \
            || curl --fail --silent --show-error --max-time 30 "${{ secrets.AI_URL }}/"
          echo ""
          echo "✅ AI service is awake!"
